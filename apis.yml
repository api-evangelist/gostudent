aid: gostudent
name: GoStudent
description: 'GoStudent is an online tutoring platform headquartered in Vienna, Austria,
  offering personalized one-on-one lessons across 30+ subjects for K-12 and university
  students. Founded in 2016, it matches learners with vetted tutors and delivers lessons
  through its own video-classroom apps for iOS, Android, and web, sold as a monthly
  subscription. Backed by SoftBank Vision Fund and Speedinvest, GoStudent grew into
  one of Europe''s largest edtech companies and has acquired peers including Tus Media,
  Seneca Learning, and Studienkreis. GoStudent does not currently publish a public
  developer API, OpenAPI specification, or developer portal; this profile captures
  its public web properties and domain-security posture as a network lead.'
